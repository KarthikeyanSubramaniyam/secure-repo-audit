[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-repo-audit"
version = "1.0.0"
description = "Offline defensive security checks for local source repositories"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
secure-repo-audit = "secure_repo_audit.scanner:main"
